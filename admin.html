<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMS Admin Dashboard</title>
    <!-- FIX: Replaced broken jsdelivr tag with the correct Supabase library source -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --primary: #0A2540; --danger: #D32F2F; --bg: #F8F9FA; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 0; }
        header { background: var(--primary); color: white; padding: 15px 20px; font-weight: bold; font-size: 1.2rem; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 15px; }
        h2 { color: var(--primary); }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-top: 20px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #EAEAEA; }
        th { background-color: var(--primary); color: white; font-weight: 600; }
        tr:hover { background-color: #F1F3F5; }
        .btn-delete { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .btn-delete:hover { background: #B71C1C; }
        .refresh-btn { background: #00D4B2; color: var(--primary); border: none; padding: 10px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; float: right; }
    </style>
</head>
<body>

    <header>POM MARKET SITE - Administration Dashboard</header>

    <div class="container">
        <button class="refresh-btn" onclick="loadInquiries()">🔄 Refresh Logs</button>
        <h2>Incoming Buyer Inquiries</h2>
        
        <table id="adminTable">
            <thead>
                <tr>
                    <th>Item ID</th>
                    <th>Buyer Contact Info</th>
                    <th>Message / Offer</th>
                    <th>Time Received</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="logsBody">
                <tr>
                    <td colspan="5" style="text-align: center; color: #888;">Loading tracking logs...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // ACTION REQUIRED: Replace placeholders with your real credentials from Supabase Settings -> API
        const URL = "YOUR_SUPABASE_URL_HERE";
        const KEY = "YOUR_SUPABASE_ANON_KEY_HERE";
        const supabaseClient = supabase.createClient(URL, KEY);

        async function loadInquiries() {
            const tbody = document.getElementById('logsBody');
            
            // Fetch all entries from the orders table
            const { data, error } = await supabaseClient
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) { 
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">Error loading dashboard records. Check API keys and RLS.</td></tr>`;
                return; 
            }

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#888;">No customer purchase inquiries recorded yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(log => {
                const date = new Date(log.created_at).toLocaleString();
                tbody.innerHTML += `
                    <tr id="row-${log.id}">
                        <td><strong>#${log.product_id}</strong></td>
                        <td><span style="color:#008751; font-weight:bold;">${escapeHtml(log.buyer_contact)}</span></td>
                        <td>${escapeHtml(log.buyer_message)}</td>
                        <td style="font-size:0.85rem; color:#666;">${date}</td>
                        <td><button class="btn-delete" onclick="deleteLog(${log.id})">Remove</button></td>
                    </tr>
                `;
            });
        }

        async function deleteLog(logId) {
            if (!confirm("Are you sure you want to delete this log entry?")) return;

            const { error } = await supabaseClient
                .from('orders')
                .delete()
                .eq('id', logId);

            if (error) {
                alert('Could not remove log entry.');
            } else {
                const row = document.getElementById(`row-${logId}`);
                if (row) row.remove();
            }
        }

        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initialize dashboard pull on load
        window.onload = loadInquiries;
    </script>
</body>
</html>
