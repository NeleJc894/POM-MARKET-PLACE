<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POM MARKET SITE</title>
    <!-- Fixed: Swapped out the blocked/empty script tags with a working Supabase mirror CDN link -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root { --primary: #0A2540; --accent: #FF6600; --success: #008751; --light: #F8F9FA; }
        body { font-family: sans-serif; margin: 0; background: var(--light); color: #333; }
        header { background: var(--primary); color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo-group { display: flex; align-items: center; gap: 12px; }
        .pms-icon { background: var(--accent); color: white; font-weight: 900; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #EAEAEA; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
        .card { background: white; border-radius: 8px; padding: 15px; border: 1px solid #EAEAEA; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .price { color: var(--accent); font-weight: bold; font-size: 1.4rem; margin: 10px 0; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-accent { background: var(--accent); }
        .btn-auth { background: #E2E8F0; color: var(--primary); border: 1px solid #CBD5E1; }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); width: 90%; max-width: 440px; z-index: 1000; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        input { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        /* Debug Visual Panel */
        .debug-panel { background: #FFFBEB; border: 2px solid #D97706; padding: 15px; border-radius: 6px; margin-bottom: 20px; color: #92400E; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; }
    </style>
</head>
<body>

    <header>
        <div class="logo-group">
            <div class="pms-icon">PMS</div>
            <div style="font-size: 1.3rem; font-weight: bold;">POM MARKET SITE</div>
        </div>
        <div id="authStatus">
            <button class="btn btn-auth" onclick="openAuthModal()">🔑 Seller Register / Login</button>
        </div>
    </header>

    <div class="container">
        <!-- Live System Diagnostic Display -->
        <div id="diagnosticLog" class="debug-panel">🔄 Diagnostic Trace Active: Initializing client hooks...</div>

        <div class="top-bar">
            <h2 style="margin:0; color: var(--primary);">Verified Marketplace Listings</h2>
            <button class="btn btn-accent" onclick="goToSellerPanel()">➕ List My Product / Service</button>
        </div>
        <div id="catalog" class="grid">Loading wholesale marketplace...</div>
    </div>

    <div class="overlay" id="overlay" onclick="closeModals()"></div>

    <!-- Auth Modal -->
    <div class="modal" id="authModal">
        <h3>Seller Registration / Login</h3>
        <form id="authForm" onsubmit="event.preventDefault(); handleAuth();">
            <label>Email</label>
            <input type="email" id="authEmail" required>
            <label>Password</label>
            <input type="password" id="authPassword" required>
            <button type="submit" class="btn btn-accent" style="width:100%;">Submit</button>
        </form>
    </div>

    <script>
        const logPanel = document.getElementById('diagnosticLog');
        function appendLog(text) {
            logPanel.innerText += "\n" + text;
        }

        // 1. Check Library Visibility
        if (typeof supabase === 'undefined') {
            appendLog("❌ CRITICAL ERROR: The Supabase script library did not load. Please confirm your internet connection can read public file CDNs.");
            document.getElementById('catalog').innerText = "Library block error.";
        } else {
            appendLog("✅ Library initialized successfully.");
            
            // 2. Client Authentication Attempt
            try {
                // Fixed: Swapped generic supabase.co URL structure with your authentic unique database endpoint instance
                const SUPABASE_URL = "https://ibapfafstteqyrmpnhvo.supabase.co";
                const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImliYXBmYWZzdHRlcXlybXBuaHZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMDc2NjYsImV4cCI6MjEwODY4MzY2Nn0.HV40B7DHZeQZHOqscN0CmTul-gOD_SG-2rDv9vcPy0w";
                const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                appendLog("✅ Supabase client connection hook bound.");

                // 3. Database Execution Path
                async function fetchRecords() {
                    appendLog("📡 Dispatching network request to 'products' table...");
                    const { data, error } = await supabaseClient.from('products').select('*');
                    
                    if (error) {
                        appendLog("❌ DATABASE ERROR: " + error.message + " (Code: " + error.code + ")");
                        document.getElementById('catalog').innerText = "Database connection error.";
                        return;
                    }
                    
                    appendLog("✅ Network response completed. Records found: " + (data ? data.length : 0));
                    
                    const catalog = document.getElementById('catalog');
                    if (!data || data.length === 0) {
                        catalog.innerText = "No listings running in Port Moresby yet.";
                        return;
                    }
                    
                    catalog.innerHTML = '';
                    data.forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <div>
                                <h3 style="margin:0 0 10px 0; color: var(--primary);">${p.title || 'Unnamed Item'}</h3>
                                <p style="margin:0; font-size:0.9rem; color:#666;">${p.description || 'No description available.'}</p>
                                <div class="price">K${p.price || '0.00'}</div>
                            </div>
                            <button class="btn">Contact Wholesaler</button>
                        `;
                        catalog.appendChild(card);
                    });
                }
                
                fetchRecords();

            } catch(err) {
                appendLog("❌ CRITICAL INTERNALS ERROR: " + err.message);
            }
        }

        function openAuthModal() {
            document.getElementById('authModal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }
        function closeModals() {
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
        function goToSellerPanel() {
            window.location.href = "seller.html";
        }
    </script>
</body>
</html>
