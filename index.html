<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POM MARKET SITE</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --primary: #0A2540; --accent: #FF6600; --success: #008751; --light: #F8F9FA; }
        body { font-family: sans-serif; margin: 0; background: var(--light); color: #333; }
        header { background: var(--primary); color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo-group { display: flex; align-items: center; gap: 12px; }
        .pms-icon { background: var(--accent); color: white; font-weight: 900; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #EAEAEA; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
        .card { background: white; border-radius: 8px; padding: 15px; border: 1px solid #EAEAEA; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .price { color: var(--accent); font-weight: bold; font-size: 1.4rem; margin: 10px 0; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-accent { background: var(--accent); }
        .btn-auth { background: #E2E8F0; color: var(--primary); border: 1px solid #CBD5E1; }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); width: 90%; max-width: 440px; z-index: 1000; max-height: 90vh; overflow-y: auto; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .checkbox-group input { width: auto; margin: 0; }
    </style>
</head>
<body>

    <header>
        <div class="logo-group">
            <div class="pms-icon">PMS</div>
            <div style="font-size: 1.3rem; font-weight: bold; letter-spacing: 0.5px;">POM MARKET SITE</div>
        </div>
        <div id="authStatus">
            <button class="btn btn-auth" onclick="openAuthModal()">🔑 Seller Register / Login</button>
        </div>
    </header>

    <div class="container">
        <div class="top-bar">
            <h2 style="margin:0; color: var(--primary);">Verified Marketplace Listings</h2>
            <button class="btn btn-accent" onclick="goToSellerPanel()">➕ List My Product / Service</button>
        </div>
        <div id="catalog" class="grid">Loading wholesale marketplace...</div>
    </div>

    <div class="overlay" id="overlay" onclick="closeModals()"></div>

    <!-- Reg/Login Auth Modal -->
    <div class="modal" id="authModal">
        <h3 id="authTitle">Seller Login</h3>
        <p id="authDesc" style="font-size:0.85rem; color:#666; margin-bottom:15px;">Log in to access your dashboard.</p>
        
        <form id="authForm" onsubmit="event.preventDefault(); handleAuth();">
            <!-- Registration Verified Fields Block (Hidden by default in Login View) -->
            <div id="regFields" style="display: none;">
                <label>Genuine Full Name *</label>
                <input type="text" id="regName" placeholder="e.g., John Doe">
                
                <div class="checkbox-group">
                    <input type="checkbox" id="regIsCompany" onchange="toggleCompanyInput()">
                    <label for="regIsCompany" style="font-weight: bold;">Registering as a Corporate Business/Company?</label>
                </div>
                
                <div id="companyFieldContainer" style="display: none;">
                    <label>Registered Company/Business Name *</label>
                    <input type="text" id="regCompanyName" placeholder="e.g., Alidata Analytics Ltd">
                </div>
                
                <label>Date of Birth *</label>
                <input type="date" id="regDOB">
                
                <label>Unique Phone Number (Allowed Once) *</label>
                <input type="text" id="regPhone" placeholder="e.g., 71234567">
            </div>

            <label>Account Email *</label>
            <input type="email" id="authEmail" placeholder="yourname@gmail.com" required>
            
            <label>Account Password *</label>
            <input type="password" id="authPassword" placeholder="••••••••" required>
            
            <button type="submit" class="btn btn-accent" style="width:100%; margin-top:10px;" id="mainAuthBtn">Sign In</button>
        </form>
        
        <p style="text-align:center; font-size:0.9rem; margin-top:15px; margin-bottom:0;">
            <a href="#" id="toggleAuthLink" onclick="toggleAuthMode(event)">Don't have an account? Register here</a>
        </p>
    </div>

    <!-- Inquiry Handshake Window -->
    <div class="modal" id="buyModal">
        <h3>Contact Wholesaler</h3>
        <p id="modal-item-title" style="font-weight: bold; color: var(--accent);"></p>
        <label>Your Phone or WhatsApp Contact Link</label>
        <input type="text" id="buyerContact" placeholder="e.g., 71234567">
        <label>Your Inquiry Message</label>
        <textarea id="buyerMsg" rows="3" placeholder="Ask about price, stock, or pickup arrangements..."></textarea>
        <button class="btn btn-accent" style="width:100%;" onclick="sendInquiry()">Submit Inquiry</button>
    </div>

    <script>
        const SUPABASE_URL = "https://ibapfafstteqyrmpnhvo.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImliYXBmYWZzdHRlcXlybXBuaHZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMDc2NjYsImV4cCI6MjEwODY4MzY2Nn0.HV40B7DHZeQZHOqscN0CmTul-gOD_SG-2rDv9vcPy0w";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentId = null;
        let isRegisterMode = false;
        let currentUser = null;

        async function checkUserSession() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            currentUser = user;
            const statusDiv = document.getElementById('authStatus');
            if (user) {
                statusDiv.innerHTML = `
                    <span style="color:white; margin-right:10px; font-size:0.9rem;">👋 ${user.email}</span>
                    <button class="btn" style="background:#D32F2F; padding:6px 12px;" onclick="handleLogout()">Sign Out</button>
                `;
            } else {
                statusDiv.innerHTML = `<button class="btn btn-auth" onclick="openAuthModal()">🔑 Seller Register / Login</button>`;
            }
        }

        function openAuthModal() {
            document.getElementById('authModal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function closeModals() {
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('buyModal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        function toggleCompanyInput() {
            const isChecked = document.getElementById('regIsCompany').checked;
            document.getElementById('companyFieldContainer').style.display = isChecked ? 'block' : 'none';
        }

        function toggleAuthMode(e) {
            e.preventDefault();
            isRegisterMode = !isRegisterMode;
            document.getElementById('authTitle').innerText = isRegisterMode ? "Verify & Create Account" : "Seller Login";
            document.getElementById('authDesc').style.display = isRegisterMode ? 'none' : 'block';
            document.getElementById('regFields').style.display = isRegisterMode ? 'block' : 'none';
            document.getElementById('mainAuthBtn').innerText = isRegisterMode ? "Verify & Register" : "Sign In";
            document.getElementById('toggleAuthLink').innerText = isRegisterMode ? "Already registered? Login here" : "Don't have an account? Register here";
        }

        async function handleAuth() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            
            if (isRegisterMode) {
                const name = document.getElementById('regName').value.trim();
                const dob = document.getElementById('regDOB').value;
                const phone = document.getElementById('regPhone').value.trim();
                const isCompany = document.getElementById('regIsCompany').checked;
                const companyName = document.getElementById('regCompanyName').value.trim();

                if(!name || !dob || !phone || (isCompany && !companyName)) {
                    alert('Please complete all genuine validation fields.'); return;
                }

                // First, check if the phone number is already registered in the profiles database table
                const { data: phoneCheck } = await supabaseClient.from('profiles').select('phone_number').eq('phone_number', phone);
                if (phoneCheck && phoneCheck.length > 0) {
                    alert('Security Alert: This phone number is already registered once. You cannot use it again.');
                    return;
                }


        loadItems();
    </script>
</body>
</html>
